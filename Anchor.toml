# Blindseal Anchor workspace (BLINDSEAL.md §3.7, §4). Programs live in their own Cargo
# workspace (programs/Cargo.toml). Program IDs are FIXED (keypairs in keys/localnet/, synced to
# target/deploy by scripts/anchor-keys.sh) and shared by localnet and mainnet — the test proof
# binds transfer_gate's id, so it must be stable across machines. Mainnet is the only deploy
# target; localnet is for the test suite. No devnet.
[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
blindseal_verify = "merZNYKpKwwX4CGgzvma3jPvLfrMTkZcb1cSXUKANcb"
transfer_gate = "ErAS5x2oUky3aCJPasSKNaf8USVE9of5vzHHCPWwSEVG"

[programs.mainnet]
blindseal_verify = "merZNYKpKwwX4CGgzvma3jPvLfrMTkZcb1cSXUKANcb"
transfer_gate = "ErAS5x2oUky3aCJPasSKNaf8USVE9of5vzHHCPWwSEVG"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tests/tsconfig.json -t 1000000 tests/**/*.spec.ts"

[test]
startup_wait = 10000

[test.validator]
ledger = ".anchor/test-ledger"
