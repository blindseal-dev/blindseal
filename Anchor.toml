# Blindseal Anchor workspace. Programs live in their own Cargo
# workspace (programs/Cargo.toml). Program IDs are FIXED (keypairs in keys/localnet/, synced to
# target/deploy by scripts/anchor-keys.sh) and shared by localnet and mainnet — the test proof
# binds transfer_gate's id, so it must be stable across machines. Mainnet is the only deploy
# target; localnet is for the test suite. No devnet.
[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
blindseal_verify = "6z4HehpRyppJDxGXJubE7Z4GpE6feNytUb2Udya6kaGx"
transfer_gate = "9fjiagKZvaJ1cW1zEiddZD6iBemEARKfFQ4dW1mV5FKa"

[programs.mainnet]
blindseal_verify = "6z4HehpRyppJDxGXJubE7Z4GpE6feNytUb2Udya6kaGx"
transfer_gate = "9fjiagKZvaJ1cW1zEiddZD6iBemEARKfFQ4dW1mV5FKa"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The suite runs on our own Agave 4.3.1 validator with the programs genesis-loaded (see the
# script header for why anchor's deploy path did not work here). `anchor test --skip-build
# --skip-deploy --skip-local-validator` or simply `scripts/test-m2.sh`.
test = "scripts/test-m2.sh"

[test]
startup_wait = 10000

[test.validator]
ledger = ".anchor/test-ledger"

# Load the built programs at genesis (executable immediately, as the admin smoke does) instead of
# Anchor's `solana program deploy`, which left them "Program is not deployed" on this toolchain.
# Run: anchor test --skip-build --skip-deploy
[[test.genesis]]
address = "6z4HehpRyppJDxGXJubE7Z4GpE6feNytUb2Udya6kaGx"
program = "target/deploy/blindseal_verify.so"

[[test.genesis]]
address = "9fjiagKZvaJ1cW1zEiddZD6iBemEARKfFQ4dW1mV5FKa"
program = "target/deploy/transfer_gate.so"
