        <div class="bs-side__foot" data-foot>
          <div class="bs-proxy">
            <span class="bs-proxy__k"><span class="live-dot" aria-hidden="true"></span>Proxy</span>
            <button type="button" class="hash" data-hash data-label="Proxy signer (ed25519)" aria-label="Proxy signer (ed25519) . Copy"><span class="hash__v"></span></button>
          </div>
          <div class="bs-side__footrow">
            <span class="bs-side__ver" data-ver></span>
            <button type="button" class="icon-btn" data-collapse aria-pressed="false" aria-label="Collapse the sidebar" title="Collapse the sidebar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-panel-left" data-lucide="panel-left" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path></svg></button>
          </div>
        </div>
      </aside>
      <div class="bs-work">
        <header class="glass-bar glass-bar--top bs-top">
          <div class="bs-top__lead">
            <p class="bs-top__title" data-title></p>
            <span class="bs-top__actions" data-actions></span>
          </div>
          <div class="bs-top__right">
            <button type="button" class="conn" data-conn data-state="connected" aria-live="polite"><span class="live-dot" aria-hidden="true"></span><span data-conn-label>Connected</span><span class="conn__addr" data-conn-addr>127.0.0.1:7777</span></button>
          </div>
        </header>
        <main id="main-content" class="bs-main" tabindex="-1"></main>
      </div>
      <div class="bs-cover" aria-hidden="true"><div class="bs-cover__ind"><svg xmlns="http://www.w3.org/2000/svg" class="bs-mark bs-mark--A" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.286" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10.25"></circle><rect x="7.25" y="10.6" width="9.5" height="2.8" rx="1.4"></rect></svg><div class="track"><span></span></div></div></div>
      <footer class="glass-bar glass-bar--bottom bs-status" aria-label="Proxy status">
        <span class="bs-sb" data-sb-conn data-state="connected"><span class="live-dot" aria-hidden="true"></span><span class="bs-sb__v" data-sb-conn-label>Screening</span></span>
        <span class="bs-sb"><span class="bs-sb__k">audit #</span><span class="bs-sb__v num" data-sb-audit></span><span data-sb-audit-hash><button type="button" class="hash" data-hash data-label="Audit head hash" aria-label="Audit head hash . Copy"><span class="hash__v"></span></button></span></span>
        <span class="bs-sb"><span class="bs-sb__k">policy</span><span data-sb-policy><button type="button" class="hash" data-hash data-label="Policy root" aria-label="Policy root . Copy"><span class="hash__v"></span></button></span></span>
        <span class="bs-sb"><span class="bs-sb__k">detector</span><span class="bs-sb__v" data-sb-detector></span></span>
        <span class="bs-sb"><span class="bs-sb__k">L3</span><span class="bs-sb__v" data-sb-l3></span></span>
        <span class="bs-status__spacer"></span>
        <a class="glass-item" href="#privacy" data-stub="Privacy">Privacy</a>
        <a class="glass-item" href="https://blindseal.tech/docs">Docs</a>
        <a class="glass-item" href="#help" data-stub="Help">Help</a>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
