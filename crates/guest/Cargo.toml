# Blindseal SP1 guest (M1). Recomputes payloadHash, runs detector-core's L0/L1 on PRE-SERIALIZED
# DFAs (no regex compilation in-zkVM, §3.4), asserts PASS, and commits public values. Built for
# the SP1 riscv target with the succinct toolchain; NOT part of the host workspace.
[package]
name = "blindseal-guest"
version = "0.0.0"
edition = "2021"
license = "MIT"

[dependencies]
sp1-zkvm = "=5.0.0"
blindseal-detector-core = { path = "../detector-core" }
sha2 = "=0.10.8"

# SP1 sha256 precompile: accelerates sha2 in-zkVM (payloadHash + the policyRoot merkle over DFA
# bytes dominate cycles). Tag sp1-4.0.0 = minimum SP1 4.0.0, compatible with our 5.0.0 pin
# (6.x tags require SP1 >=6). Only activates under the zkVM target; host tests use stock sha2.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-4.0.0" }
