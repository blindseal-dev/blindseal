# Blindseal off-chain Groth16 verifier (M1). Verifies an attestation.json with sp1-verifier
# (the off-chain counterpart to sp1-solana), using the SP1 v5 Groth16 VK. Standalone (own
# Cargo.lock; also the base for a wasm32 build for the verify page). lib + a CLI bin.
[package]
name = "blindseal-verifier"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blindseal-verify"
path = "src/main.rs"

[dependencies]
sp1-verifier = "=5.0.0"
serde_json = "1"

# wasm32 only: expose verify_attestation to JS. Native (CLI, tests) never pulls this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
