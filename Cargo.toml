# Blindseal Rust workspace — M0 stub. Real guest/prover/programs land in M0.5 and M1/M2.
# NOT YET COMPILED: the Rust/Solana/Anchor/SP1 toolchains are not installed in the M0
# environment (see DECISIONS.md). This file fixes the layout per BLINDSEAL.md §4.
[workspace]
resolver = "2"
members = [
  "crates/detector-core",
]
# crates/guest builds for the SP1 (riscv) target with its own toolchain; the Anchor
# programs build via `anchor build`. Both are excluded from the host workspace.
exclude = [
  "crates/guest",
  "crates/prover",
  "crates/verifier-wasm",
  "m05-spike",
  "programs/blindseal-verify",
  "programs/transfer-gate",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

# Anchor's build lint reads this root manifest (Anchor.toml lives here) even though the programs
# resolve in programs/Cargo.toml, which sets the same profile for the actual SBF build.
[profile.release]
overflow-checks = true
