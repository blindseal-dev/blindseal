# Blindseal example gated program (M2): a native-SOL transfer that requires an attestation.
# CPIs blindseal-verify in the same transaction with the action fields IT executes. Ships as an
# example, not a published crate.
[package]
name = "transfer-gate"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_gate"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "blindseal-verify/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["allow-missing-optionals"] }   # 0.8.0: trailing optional fee accounts; pre-0.8.0 callers omit them
solana-security-txt = "=1.1.1"   # neodyme security.txt (readable by explorers; pre-public pass step 3)
blindseal-verify = { path = "../blindseal-verify", features = ["cpi"] }
