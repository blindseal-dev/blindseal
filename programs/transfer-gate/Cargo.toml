# Blindseal example gated program (M2): a native-SOL transfer that requires an attestation.
# CPIs blindseal-verify in the same transaction with the action fields IT executes. Ships as an
# example, not a published crate (BLINDSEAL.md §8 Q5 default).
[package]
name = "transfer-gate"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_gate"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "blindseal-verify/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
blindseal-verify = { path = "../blindseal-verify", features = ["cpi"] }
