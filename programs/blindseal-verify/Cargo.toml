# Blindseal on-chain verifier (M2) — Anchor program, built with `anchor build`.
# Groth16 verify via sp1-solana (SP1 v5 VK) + nullifier set + vkey/policy allowlists
# (check order in src/lib.rs). Pinned: anchor 0.31.1, sp1-solana 0.1.0.
[package]
name = "blindseal-verify"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "blindseal_verify"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
solana-security-txt = "=1.1.1"   # neodyme security.txt (readable by explorers; pre-public pass step 3)
sp1-solana = "=0.1.0"
