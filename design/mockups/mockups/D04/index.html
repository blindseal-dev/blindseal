<!--
  Blindseal mockups · D04 — Policy (/policy)
  Edit the committed policy and watch the Merkle root change; test a payload
  against it without logging anything.
  Rules are edited in a working copy (memory only). Save = BS.data.savePolicy
  (PUT /policy {rules}: the server recomputes the root, version + 1); Discard
  restores the saved copy. Dry run = POST /policy/dry-run {payload} → a
  Decision that is not logged and not chained.
  Switches: ?now=<ms> · ?motion=reduce | slow | full · ?state=offline (Save
  rejects OFFLINE) · ?example=block | pass (preload the dry-run textarea).
  page.js renders #d04 from BS.data.
-->
